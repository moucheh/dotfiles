[bar.default]
background_opacity = 0.64999998547136784
center = [ "clock", "notifications", "privacy" ]
end = [ "tray", "network", "bluetooth", "volume", "battery" ]
margin_edge = 0
margin_ends = 0
radius = 0
start = [ "launcher", "workspaces", "active_window" ]
thickness = 32
widget_spacing = 16

    [bar.default.dead_zone.actions]
    left = "panel-toggle control-center home"
    middle = "exec niri msg action close-window"
    right = "exec niri msg action maximize-column"

[control_center.calendar]
show_events_card = false

