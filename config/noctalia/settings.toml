[dock]
auto_hide = true
background_opacity = 0.64999998547136784
enabled = true
item_spacing = 8
launcher_position = "end"
magnification_scale = 1.1500000022351742
pinned = [ "brave-origin", "io.freetubeapp.FreeTube", "org.wezfurlong.wezterm" ]
radius = 32
reserve_space = false
show_dots = true

[hot_corners]
enabled = true

    [hot_corners.top_left]
    action = "command"
    command = "niri msg action toggle-overview"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[keybinds]
down = [ "Down", "Ctrl+j" ]
left = [ "Left", "Ctrl+h" ]
right = [ "Right", "Ctrl+l" ]
tab_next = [ "Tab", "Ctrl+u" ]
tab_previous = [ "Shift+ISO_Left_Tab", "Ctrl+i" ]
up = [ "Up", "Ctrl+k" ]

