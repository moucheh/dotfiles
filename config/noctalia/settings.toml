[nightlight]
enabled = true
temperature_night = 4500

[notification]
background_opacity = 0.64999998547136784
layer = "overlay"

[osd]
background_opacity = 0.59999998658895493

[plugin_settings."noctalia/screen_recorder"]
restore_portal = true

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/timer", "noctalia/translator" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "~/Pictures/tenma.png"
clipboard_auto_paste = "ctrl_shift_v"
date_format = "%A, %d %B %Y"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
time_format = "{:%I:%M}"

    [shell.animation]
    enabled = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.launcher]
    app_grid = true

        [shell.launcher.providers.calculator]
        global = true

        [shell.launcher.providers.emoji]
        global = false
        prefix = "emo"

        [shell.launcher.providers.session]
        global = false
        prefix = "session"

        [shell.launcher.providers.wallpaper]
        global = false
        prefix = "wall"

        [shell.launcher.providers.windows]
        global = false
        prefix = "win"

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    polkit_placement = "attached"
    transparency_mode = "glass"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "e"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "Ctrl+l"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "p"
    variant = "destructive"

[theme]
builtin = "Noctalia"
custom_palette = "abstract-mc"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "cava", "foot", "gtk3", "gtk4", "kcolorscheme", "mango", "niri", "qt", "wezterm" ]
    community_ids = [ "zed", "bat", "yazi" ]

[wallpaper]
directory = "~/Pictures/WallPapers"
enabled = true
transition_on_startup = true

    [wallpaper.default]
    path = "/home/moucheh/Pictures/WallPapers/e46.jpg"

    [wallpaper.last]
    path = "/home/moucheh/Pictures/WallPapers/e46.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/moucheh/Pictures/WallPapers/e46.jpg"

    [[wallpaper.favorite]]
    path = "~/Pictures/WallPapers/tp-wallpaper.jpg"
    theme_mode = "auto"

[widget.active_window]
max_length = 150
min_length = 40

[widget.audio_visualizer]
bands = 4
mirrored = false
width = 10

[widget.bluetooth]
hide_when_no_connected_device = true
show_label = true

[widget.clock]
enabled = true
format = "{:%I:%M ~ %d}"
tooltip_format = "{:%d %B %Y}"

[widget.launcher]
custom_image = "/usr/share/noctalia/assets/images/distros/fedora.svg"
custom_image_colorize = true

    [widget.launcher.actions]
    right = "exec wezterm -e ~/.config/niri/scripts/fastfetch.sh"

[widget.media]
hide_when_no_media = true
title_scroll = "always"

[widget.notifications]
hide_when_no_unread = true

[widget.privacy]
hide_inactive = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.sysmon]
show_value = true
visualization = "gauge"

[widget.tray]
drawer = true
enabled = true
hidden = [ "nm-applet", "blueman-tray" ]

[widget.weather]
show_condition = false
